[project]
name = "workbuddy-watermark-remover"
version = "0.1.0"
description = "Lossless Reverse Alpha Blending watermark remover for WorkBuddy AI-generated images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
workbuddy-unwatermark = "remove_watermark:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
